{% extends "base.html" %}
{% block title %}Register — CineNest{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-glow"></div>
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:90vh">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-icon"><i class="bi bi-person-plus-fill"></i></div>
            <h2 class="auth-title">Join CineNest</h2>
            <p class="auth-sub">Create your free account today</p>
          </div>
          <form method="POST" novalidate>
            <div class="auth-field">
              <label>Full Name</label>
              <div class="field-grp">
                <i class="bi bi-person field-ico"></i>
                <input type="text" name="name" class="f-input" placeholder="Your full name" required>
              </div>
            </div>
            <div class="auth-field">
              <label>Email Address</label>
              <div class="field-grp">
                <i class="bi bi-envelope field-ico"></i>
                <input type="email" name="email" class="f-input" placeholder="you@email.com" required>
              </div>
            </div>
            <div class="auth-field">
              <label>Phone Number</label>
              <div class="field-grp">
                <i class="bi bi-phone field-ico"></i>
                <input type="tel" name="phone" class="f-input" placeholder="+91 98765 43210">
              </div>
            </div>
            <div class="auth-field">
              <label>Password</label>
              <div class="field-grp">
                <i class="bi bi-lock field-ico"></i>
                <input type="password" name="password" id="pwd" class="f-input" placeholder="Min 6 characters" required minlength="6">
                <button type="button" class="f-eye" onclick="togglePwd('pwd',this)"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <button type="submit" class="cn-btn-wine w-100 auth-submit mt-2">
              <i class="bi bi-person-check me-2"></i>Create Account
            </button>
          </form>
          <div class="auth-or"><span>or</span></div>
          <p class="text-center text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="wine-link">Sign in</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePwd(id,btn){const f=document.getElementById(id);const i=btn.querySelector('i');f.type=f.type==='password'?'text':'password';i.className=f.type==='password'?'bi bi-eye':'bi bi-eye-slash';}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Login — CineNest{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-glow"></div>
  <div class="container">
    <div class="row justify-content-center align-items-center" style="min-height:90vh">
      <div class="col-md-5 col-lg-4">
        <div class="auth-card">
          <div class="auth-header">
            <div class="auth-icon"><i class="bi bi-person-circle"></i></div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-sub">Sign in to your CineNest account</p>
          </div>
          <form method="POST" novalidate>
            <div class="auth-field">
              <label>Email Address</label>
              <div class="field-grp">
                <i class="bi bi-envelope field-ico"></i>
                <input type="email" name="email" class="f-input" placeholder="you@email.com" required autofocus>
              </div>
            </div>
            <div class="auth-field">
              <label>Password</label>
              <div class="field-grp">
                <i class="bi bi-lock field-ico"></i>
                <input type="password" name="password" id="pwd" class="f-input" placeholder="••••••••" required>
                <button type="button" class="f-eye" onclick="togglePwd('pwd',this)"><i class="bi bi-eye"></i></button>
              </div>
            </div>
            <button type="submit" class="cn-btn-wine w-100 auth-submit">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>
          <div class="auth-or"><span>or</span></div>
          <p class="text-center text-muted small">Don't have an account? <a href="{{ url_for('register') }}" class="wine-link">Create one free</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePwd(id,btn){const f=document.getElementById(id);const i=btn.querySelector('i');f.type=f.type==='password'?'text':'password';i.className=f.type==='password'?'bi bi-eye':'bi bi-eye-slash';}
</script>
{% endblock %}
